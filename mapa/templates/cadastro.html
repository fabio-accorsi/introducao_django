
{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Mapa PUC-Rio</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            <h1>Criar conta</h1>
            <p>Cadastre-se para acessar o mapa da PUC-Rio.</p>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit">Cadastrar</button>
            </form>

            <p class="auth-link">
                Já possui uma conta?
                <a href="{% url 'login' %}">Faça login</a>
            </p>
        </div>
    </main>
</body>
</html>
