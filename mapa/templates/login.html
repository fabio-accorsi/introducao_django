
{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mapa PUC-Rio</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            <h1>Bem-vindo!</h1>
            <p>Entre na sua conta para acessar o mapa.</p>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit">Entrar</button>
            </form>

            <p class="auth-link">
                Ainda não possui uma conta?
                <a href="{% url 'cadastro' %}">Cadastre-se</a>
            </p>
        </div>
    </main>
</body>
</html>
